<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="家餐桌">
  <!--
    家餐桌的图标源文件（真源）：所有 PNG / ICO 都由它生成，改设计只改这里。
    生成命令见同目录的 README.md（要 rsvg-convert + ImageMagick）。

    设计约束（都是「标签页里要能一眼看出不同」推出来的）：
      * 16×16 是最关键的一档（浏览器标签页）：512÷16 = 32，所以 1 个屏幕像素 = 32 个 SVG 单位。
        笔画要 48 单位以上才能在 16px 下站住（约 1.5px），细节一概不要。
      * 两根筷子在 16px 下必须分得开：实测过三个变体，间距小于 100 单位时它们会糊成一根，
        所以这里取中心距 116、笔宽 46（净空隙 70 单位，约 2.2px）。
      * 暖橙 #d9480f 取自应用自己的强调色 token，与邻居 pi-web 的深青圆周率字形在色相上直接拉开。
      * 形状是「碗 + 筷子」：家餐桌的直白隐喻，轮廓简单到缩成 16px 还是一个碗。
  -->
  <rect width="512" height="512" rx="116" fill="#d9480f"/>

  <!-- 筷子：先画，下端被碗口横条压住，看起来是插在碗里 -->
  <g stroke="#fff" stroke-width="46" stroke-linecap="round">
    <line x1="276" y1="108" x2="316" y2="248"/>
    <line x1="392" y1="108" x2="432" y2="248"/>
  </g>

  <!-- 碗：平口横条 + 半椭圆碗身。横条同时是「桌面线」，让整体在 16px 下有个稳定的水平重心 -->
  <path d="M64 236h384v34H64z" fill="#fff"/>
  <path d="M96 270h320a160 152 0 0 1-320 0z" fill="#fff"/>
</svg>
